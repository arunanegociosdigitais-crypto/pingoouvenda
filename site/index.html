<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Pingou Venda — Gestão para quem vende local</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#0a0214;
        --bg-2:#12042a;
        --surface:#180737;
        --surface-2:#1f0a45;
        --line:rgba(199,125,255,.22);
        --line-soft:rgba(199,125,255,.12);
        --violet:#7b2ff7;
        --violet-2:#9d4edd;
        --violet-3:#c77dff;
        --text:#f4efff;
        --muted:#b9a8d9;
        --muted-2:#8f7db8;
        --good:#3ddc97;
        --bad:#ff6b8a;
        --warn:#ffc857;
        --radius:16px;
        --font-display:"Sora",system-ui,sans-serif;
        --font-body:"Inter",system-ui,sans-serif;
      }
      *{box-sizing:border-box}
      html{scroll-behavior:smooth}
      body{
        margin:0;background:var(--bg);color:var(--text);
        font-family:var(--font-body);font-size:16px;line-height:1.55;
        -webkit-font-smoothing:antialiased;
      }
      body::before{
        content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
        background:
          radial-gradient(700px 380px at 85% -60px, rgba(123,47,247,.28), transparent 65%),
          radial-gradient(560px 340px at -120px 30%, rgba(157,78,221,.16), transparent 60%);
      }
      #app{position:relative;z-index:1}
      a{color:var(--violet-3)}
      button{font-family:inherit;cursor:pointer}
      input,select,textarea{font-family:inherit}
      h1,h2,h3{font-family:var(--font-display);line-height:1.15;margin:0}
      .wrap{max-width:1120px;margin:0 auto;padding:0 20px}

      /* ---------- buttons ---------- */
      .btn{
        display:inline-flex;align-items:center;justify-content:center;gap:8px;
        border:0;border-radius:12px;padding:13px 26px;font-weight:700;font-size:16px;
        text-decoration:none;transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
      }
      .btn-primary{
        background:linear-gradient(135deg,var(--violet) 0%,var(--violet-2) 100%);
        color:#fff;box-shadow:0 10px 28px rgba(123,47,247,.38);
      }
      .btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 34px rgba(123,47,247,.5)}
      .btn-ghost{
        background:rgba(199,125,255,.07);color:var(--text);border:1px solid var(--line);
      }
      .btn-ghost:hover{background:rgba(199,125,255,.14)}
      .btn-big{padding:16px 34px;font-size:17px;border-radius:14px;width:100%}
      .btn-sm{padding:9px 16px;font-size:14px;border-radius:10px}
      .btn-danger{background:rgba(255,107,138,.12);color:var(--bad);border:1px solid rgba(255,107,138,.35)}
      .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

      /* ---------- landing ---------- */
      .topbar{
        display:flex;align-items:center;justify-content:space-between;gap:16px;
        padding:18px 0;
      }
      .brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text)}
      .brand .mark{
        width:46px;height:46px;border-radius:13px;display:grid;place-items:center;flex:none;
        background:linear-gradient(145deg,#2a0a57,#170433);border:1px solid var(--line);
        box-shadow:0 8px 22px rgba(123,47,247,.35);
      }
      .brand .word{font-family:var(--font-display);font-weight:800;font-size:23px;letter-spacing:-.02em}
      .brand .word em{font-style:normal;color:var(--violet-3)}
      .topbar .actions{display:flex;gap:10px;align-items:center}
      .hero{padding:44px 0 30px;text-align:left}
      .hero-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
      .hero h1{font-size:clamp(34px,5.4vw,58px);font-weight:800;letter-spacing:-.02em}
      .hero h1 .hl{color:var(--violet-3)}
      .hero p.lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:52ch;margin:20px 0 30px}
      .hero .cta-row{display:flex;gap:14px;flex-wrap:wrap}
      .hero .micro{margin-top:16px;color:var(--muted-2);font-size:14px}
      .hero .micro strong{color:var(--violet-3)}
      .mascot-spot{display:flex;justify-content:center}
      .mascot-card{
        background:linear-gradient(160deg,var(--surface-2),var(--bg-2));
        border:1px solid var(--line);border-radius:24px;padding:26px 30px 18px;text-align:center;
        box-shadow:0 24px 60px rgba(0,0,0,.45);
      }
      .mascot-card p{margin:10px 0 8px;color:var(--muted);font-size:14px}
      .mascot-card p strong{color:var(--text)}

      .demo{margin:26px 0 10px}
      .demo-head{display:flex;align-items:baseline;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
      .demo-head h2{font-size:26px}
      .demo-tag{
        font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
        color:var(--violet-3);border:1px solid var(--line);border-radius:999px;padding:5px 12px;
        background:rgba(123,47,247,.1);
      }
      .demo-frame{
        border:1px solid var(--line);border-radius:20px;overflow:hidden;
        background:linear-gradient(170deg,#150531,#0d0220);box-shadow:0 30px 70px rgba(0,0,0,.5);
      }
      .demo-bar{
        display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line-soft);
        background:rgba(199,125,255,.05);
      }
      .demo-bar .dot{width:11px;height:11px;border-radius:50%}
      .demo-bar .addr{
        margin-left:8px;font-size:13px;color:var(--muted);background:rgba(0,0,0,.3);
        padding:4px 14px;border-radius:999px;border:1px solid var(--line-soft);
      }
      .demo-body{padding:22px}
      .demo-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
      .kpi{
        background:rgba(199,125,255,.06);border:1px solid var(--line-soft);
        border-radius:14px;padding:14px 16px;
      }
      .kpi .label{font-size:12.5px;color:var(--muted);font-weight:600}
      .kpi .value{font-family:var(--font-display);font-size:22px;font-weight:700;margin-top:3px}
      .kpi .delta{font-size:12.5px;color:var(--good);font-weight:600}
      .demo-chart{margin-top:16px;background:rgba(199,125,255,.05);border:1px solid var(--line-soft);border-radius:14px;padding:16px}
      .demo-chart .label{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:8px}

      .section{padding:52px 0}
      .section h2{font-size:clamp(26px,3.4vw,36px);letter-spacing:-.01em}
      .section .sub{color:var(--muted);max-width:60ch;margin:12px 0 30px;font-size:17px}
      .niches{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
      .niche{
        background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:24px;
      }
      .niche h3{font-size:19px;margin-bottom:8px}
      .niche p{color:var(--muted);margin:0 0 14px;font-size:15px}
      .chip-row{display:flex;flex-wrap:wrap;gap:7px}
      .chip{
        font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;
        background:rgba(123,47,247,.14);border:1px solid var(--line-soft);color:var(--violet-3);
      }
      .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
      .step{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:24px}
      .step .num{
        width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-family:var(--font-display);
        font-weight:800;background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;margin-bottom:14px;
      }
      .step h3{font-size:18px;margin-bottom:6px}
      .step p{color:var(--muted);margin:0;font-size:15px}
      .cta-band{
        margin:10px 0 60px;border-radius:22px;padding:38px 34px;text-align:center;
        background:linear-gradient(140deg,#2b0a5c,#170433 70%);border:1px solid var(--line);
      }
      .cta-band h2{font-size:clamp(24px,3.4vw,34px)}
      .cta-band p{color:var(--muted);margin:12px auto 24px;max-width:52ch}
      .cta-band .cta-row{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
      footer.site{border-top:1px solid var(--line-soft);padding:28px 0 40px;color:var(--muted-2);font-size:14.5px}
      footer.site .row{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center}
      footer.site a{font-weight:600;text-decoration:none}

      /* ---------- auth ---------- */
      .auth-shell{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:34px 20px 60px}
      .auth-card{width:100%;max-width:440px;margin-top:26px}
      .auth-brand{display:flex;align-items:center;gap:14px;justify-content:center;text-decoration:none;color:var(--text)}
      .auth-brand .mark{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(145deg,#2a0a57,#170433);border:1px solid var(--line);box-shadow:0 10px 26px rgba(123,47,247,.4)}
      .auth-brand .word{font-family:var(--font-display);font-weight:800;font-size:30px;letter-spacing:-.02em}
      .auth-brand .word em{font-style:normal;color:var(--violet-3)}
      .auth-card h1{font-size:32px;margin-top:34px}
      .auth-card .sub{color:var(--muted);margin:8px 0 28px}
      .field{margin-bottom:18px}
      .field label{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
      .input-shell{position:relative}
      .input-shell .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted-2);display:grid;place-items:center;pointer-events:none}
      .input-shell input,.input-shell select{
        width:100%;background:rgba(199,125,255,.05);border:1px solid var(--line);
        border-radius:12px;padding:14px 46px 14px 44px;color:var(--text);font-size:16px;outline:none;
        transition:border-color .15s ease, box-shadow .15s ease;
      }
      .input-shell select{padding-left:16px;appearance:none}
      .input-shell input:focus,.input-shell select:focus{border-color:var(--violet-2);box-shadow:0 0 0 3px rgba(123,47,247,.25)}
      .input-shell input::placeholder{color:var(--muted-2)}
      .eye-btn{
        position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;
        color:var(--muted-2);padding:8px;display:grid;place-items:center;border-radius:8px;
      }
      .eye-btn:hover{color:var(--violet-3)}
      .auth-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:4px 0 22px;flex-wrap:wrap}
      .remember{display:flex;align-items:center;gap:9px;cursor:pointer;font-size:15px;color:var(--muted);user-select:none}
      .remember .box{
        width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;
        color:#fff;flex:none;transition:background .15s ease,border-color .15s ease;
      }
      .remember.on .box{background:var(--violet);border-color:var(--violet)}
      .remember .box svg{opacity:0}
      .remember.on .box svg{opacity:1}
      .link-btn{background:none;border:0;color:var(--violet-3);font-weight:600;font-size:15px;padding:0;text-decoration:none}
      .link-btn:hover{text-decoration:underline}
      .form-error{
        background:rgba(255,107,138,.1);border:1px solid rgba(255,107,138,.4);color:#ffb3c2;
        border-radius:12px;padding:12px 14px;font-size:14.5px;margin-bottom:18px;display:none;
      }
      .form-error.show{display:block}
      .form-ok{
        background:rgba(61,220,151,.1);border:1px solid rgba(61,220,151,.4);color:#a9f0d2;
        border-radius:12px;padding:12px 14px;font-size:14.5px;margin-bottom:18px;display:none;
      }
      .form-ok.show{display:block}
      .auth-alt{text-align:center;color:var(--muted);margin-top:26px;font-size:15.5px}
      .auth-alt a{font-weight:700;text-decoration:none}
      .auth-alt a:hover{text-decoration:underline}
      .auth-home{display:block;text-align:center;margin-top:30px;font-weight:700;text-decoration:none}
      .trial-note{
        display:flex;gap:10px;align-items:flex-start;background:rgba(123,47,247,.1);
        border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:14.5px;color:var(--muted);
        margin-bottom:20px;
      }
      .trial-note strong{color:var(--violet-3)}
      .logo-upload{
        display:flex;align-items:center;gap:12px;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;
        cursor:pointer;color:var(--muted);font-size:14.5px;background:rgba(199,125,255,.04);
      }
      .logo-upload:hover{border-color:var(--violet-2)}
      .logo-upload img{width:40px;height:40px;border-radius:10px;object-fit:cover;display:none}
      .logo-upload input{display:none}

      /* ---------- app shell (logado) ---------- */
      .app-head{
        position:sticky;top:0;z-index:40;backdrop-filter:blur(12px);
        background:rgba(10,2,20,.82);border-bottom:1px solid var(--line-soft);
      }
      .app-head .inner{display:flex;align-items:center;gap:16px;padding:12px 0;flex-wrap:wrap}
      .app-head .brand .mark{width:40px;height:40px;border-radius:11px}
      .app-head .brand .word{font-size:20px}
      .biz{display:flex;align-items:center;gap:10px;margin-left:6px;min-width:0}
      .biz img{width:34px;height:34px;border-radius:9px;object-fit:cover;border:1px solid var(--line)}
      .biz .biz-name{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
      .biz .biz-niche{font-size:12.5px;color:var(--muted-2)}
      .main-nav{display:flex;gap:6px;margin-left:auto}
      .main-nav a{
        text-decoration:none;color:var(--muted);font-weight:600;font-size:15px;
        padding:9px 16px;border-radius:10px;
      }
      .main-nav a:hover{color:var(--text);background:rgba(199,125,255,.08)}
      .main-nav a.active{color:#fff;background:linear-gradient(135deg,var(--violet),var(--violet-2))}
      .logout-btn{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
      .logout-btn:hover{color:var(--text)}
      .page{padding:30px 0 70px}
      .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:22px}
      .page-head h1{font-size:29px}
      .page-head .sub{color:var(--muted);margin-top:5px}
      .trial-pill{
        font-size:13px;font-weight:700;color:var(--warn);border:1px solid rgba(255,200,87,.4);
        background:rgba(255,200,87,.08);border-radius:999px;padding:6px 13px;
      }

      /* métricas */
      .metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
      .metric{
        background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:20px;
      }
      .metric .label{font-size:13.5px;color:var(--muted);font-weight:600}
      .metric .value{font-family:var(--font-display);font-size:27px;font-weight:800;margin-top:5px;letter-spacing:-.01em}
      .metric .hint{font-size:13px;color:var(--muted-2);margin-top:3px}
      .panel-grid{display:grid;grid-template-columns:1.6fr 1fr;gap:14px;margin-top:14px}
      .panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:20px}
      .panel h3{font-size:16.5px;margin-bottom:16px}
      .panel h3 .right{float:right;font-size:13px;color:var(--muted-2);font-weight:500;font-family:var(--font-body)}
      .rank-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
      .rank-row:last-child{border-bottom:0}
      .rank-row .pos{width:26px;height:26px;border-radius:8px;background:rgba(123,47,247,.18);color:var(--violet-3);display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
      .rank-row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:15px}
      .rank-row .val{font-weight:700;font-size:15px}
      .rank-row .bar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--violet),var(--violet-3));margin-top:5px}
      .rank-wrap{flex:1;min-width:0}
      .empty{
        text-align:center;padding:34px 18px;color:var(--muted);border:1px dashed var(--line);
        border-radius:14px;background:rgba(199,125,255,.03);
      }
      .empty strong{color:var(--text);display:block;font-family:var(--font-display);font-size:17px;margin-bottom:6px}
      .empty .btn{margin-top:14px}
      .recent-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
      .recent-row:last-child{border-bottom:0}
      .recent-row .who{font-weight:600}
      .recent-row .meta{color:var(--muted-2);font-size:13px}
      .recent-row .amt{font-weight:700;color:var(--good);white-space:nowrap}
      .seg{display:inline-flex;background:rgba(199,125,255,.06);border:1px solid var(--line-soft);border-radius:11px;padding:4px;gap:2px;flex-wrap:wrap}
      .seg button{
        border:0;background:transparent;color:var(--muted);font-weight:600;font-size:14px;
        padding:8px 15px;border-radius:8px;
      }
      .seg button.active{background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff}

      /* vendas */
      .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
      .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:20px}
      .card h3{font-size:16.5px;margin-bottom:6px}
      .card .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
      .prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
      .prod{
        text-align:left;background:rgba(199,125,255,.05);border:1px solid var(--line-soft);
        border-radius:14px;padding:14px;color:var(--text);transition:border-color .15s ease,background .15s ease;width:100%;
      }
      .prod:hover:not(:disabled){border-color:var(--violet-2);background:rgba(123,47,247,.12)}
      .prod:disabled{opacity:.45;cursor:not-allowed}
      .prod .p-name{font-weight:700;font-size:15px;line-height:1.3}
      .prod .p-var{font-size:12.5px;color:var(--muted);margin-top:2px}
      .prod .p-price{font-family:var(--font-display);font-weight:800;color:var(--violet-3);margin-top:8px;font-size:16px}
      .prod .p-stock{font-size:12.5px;color:var(--muted-2)}
      .prod .p-stock.low{color:var(--warn);font-weight:700}
      .prod .p-stock.out{color:var(--bad);font-weight:700}
      .sell-form .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
      .sell-form label{display:block;font-weight:600;font-size:14px;margin-bottom:7px}
      .sell-form input,.sell-form select{
        width:100%;background:rgba(199,125,255,.05);border:1px solid var(--line);border-radius:11px;
        padding:12px 14px;color:var(--text);font-size:15.5px;outline:none;
      }
      .sell-form input:focus,.sell-form select:focus{border-color:var(--violet-2);box-shadow:0 0 0 3px rgba(123,47,247,.22)}
      .sell-form .field{margin-bottom:14px}
      .picker-label{font-weight:600;font-size:14px;margin:14px 0 8px}
      .picker-label:first-child{margin-top:0}
      select option{background:#1c0739;color:var(--text)}

      .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
      .toolbar input[type="search"],.toolbar select{
        background:rgba(199,125,255,.05);border:1px solid var(--line);border-radius:11px;
        padding:11px 14px;color:var(--text);font-size:15px;outline:none;
      }
      .toolbar input[type="search"]{flex:1;min-width:170px}
      .subtotal-bar{
        display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;
        background:rgba(123,47,247,.12);border:1px solid var(--line);border-radius:12px;
        padding:12px 16px;margin-bottom:14px;font-size:15px;
      }
      .subtotal-bar strong{font-family:var(--font-display);font-size:18px}
      .sale-row{
        display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-soft);
      }
      .sale-row:last-child{border-bottom:0}
      .sale-row .s-main{flex:1;min-width:0}
      .sale-row .s-name{font-weight:700;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
      .sale-row .s-meta{font-size:13px;color:var(--muted-2)}
      .sale-row .s-amt{text-align:right}
      .sale-row .s-amt .v{font-weight:800;font-family:var(--font-display)}
      .sale-row .s-amt .u{font-size:12.5px;color:var(--muted-2)}

    <div id="app"></div>

    <script>
    "use strict";
    /* ================= utilidades ================= */
    const $ = (sel, el) => (el || document).querySelector(sel);
    const $$ = (sel, el) => Array.from((el || document).querySelectorAll(sel));
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
    const BRL = (n) => (Number(n) || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const fmtDate = (ts) => new Date(ts).toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }) + " · " + new Date(ts).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" });

    function storeGet(key, fallback) {
      try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
      catch (e) { return fallback; }
    }
    function storeSet(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }

    let toastTimer = null;
    function toast(msg) {
      const t = $("#toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
    }

    /* ================= mascote (pinguim de terno roxo) ================= */
    function penguinSVG(size) {
      const s = size || 150;
      return '' +
      '<svg width="' + s + '" height="' + s + '" viewBox="0 0 200 200" role="img" aria-label="Pinguim mascote do Pingou Venda">' +
        '<ellipse cx="100" cy="182" rx="52" ry="8" fill="rgba(0,0,0,.35)"/>' +
        '<path d="M52 96 Q34 118 44 138 Q58 128 60 106 Z" fill="#241040"/>' +
        '<path d="M148 96 Q166 118 156 138 Q142 128 140 106 Z" fill="#241040"/>' +
        '<ellipse cx="100" cy="112" rx="56" ry="66" fill="#2b1150"/>' +
        '<path d="M56 66 Q100 30 144 66 L144 96 Q122 78 100 78 Q78 78 56 96 Z" fill="#1a0a33"/>' +
        '<ellipse cx="100" cy="126" rx="36" ry="44" fill="#f6f1ff"/>' +
        '<path d="M84 92 L100 116 L116 92 L108 84 L100 92 L92 84 Z" fill="#7b2ff7"/>' +
        '<path d="M96 108 L104 108 L101 122 L100 132 L99 122 Z" fill="#9d4edd"/>' +
        '<circle cx="100" cy="106" r="3.4" fill="#c77dff"/>' +
        '<circle cx="82" cy="56" r="13.5" fill="none" stroke="#c77dff" stroke-width="3.4"/>' +
        '<circle cx="118" cy="56" r="13.5" fill="none" stroke="#c77dff" stroke-width="3.4"/>' +
        '<path d="M95.5 56 L104.5 56" stroke="#c77dff" stroke-width="3.4"/>' +
        '<circle cx="82" cy="58" r="4.4" fill="#12041f"/>' +
        '<circle cx="118" cy="58" r="4.4" fill="#12041f"/>' +
        '<circle cx="83.6" cy="56.4" r="1.5" fill="#fff"/>' +
        '<circle cx="119.6" cy="56.4" r="1.5" fill="#fff"/>' +
        '<path d="M92 68 Q100 74 108 68 L100 79 Z" fill="#ffc857"/>' +
        '<ellipse cx="82" cy="180" rx="14" ry="5.5" fill="#ffc857"/>' +
        '<ellipse cx="118" cy="180" rx="14" ry="5.5" fill="#ffc857"/>' +
      '</svg>';
    }
    function penguinMini() {
      return '' +
      '<svg width="26" height="26" viewBox="0 0 200 200" aria-hidden="true">' +
        '<ellipse cx="100" cy="112" rx="62" ry="72" fill="#2b1150"/>' +
        '<ellipse cx="100" cy="128" rx="38" ry="46" fill="#f6f1ff"/>' +
        '<circle cx="80" cy="66" r="12" fill="none" stroke="#c77dff" stroke-width="9"/>' +
        '<circle cx="120" cy="66" r="12" fill="none" stroke="#c77dff" stroke-width="9"/>' +
        '<circle cx="80" cy="68" r="7" fill="#12041f"/><circle cx="120" cy="68" r="7" fill="#12041f"/>' +
        '<path d="M90 82 Q100 88 110 82 L100 94 Z" fill="#ffc857"/>' +
        '<path d="M84 104 L100 126 L116 104 L106 98 L100 106 L94 98 Z" fill="#7b2ff7"/>' +

    }

    /* ================= dados do app ================= */
    const NICHES = {
      imports: {
        label: "Imports",
        desc: "Perfumes, relógios e importados com categorias e variações prontas para montar o estoque por toque.",
        cats: {
          "Perfumes": ["Árabe", "Francês", "Designer", "Miniatura 25ml", "Contratipo"],
          "Relógios": ["Masculino", "Feminino", "Smartwatch", "Pulseira de metal", "Pulseira de couro"],
          "Óculos": ["De sol", "De grau", "Espelhado", "Polarizado"],
          "Acessórios importados": ["Carteira", "Mochila", "Boné", "Cinto"]
        }
      },
      vestuario: {
        label: "Vestuário",
        desc: "Roupas e calçados com grade de tamanhos e cores — toque, confirme e já está no estoque.",
        cats: {
          "Camisetas": ["P", "M", "G", "GG", "Preta", "Branca", "Estampada"],
          "Calças e bermudas": ["36", "38", "40", "42", "44", "Jeans", "Moletom"],
          "Vestidos e saias": ["P", "M", "G", "Florido", "Liso"],
          "Calçados": ["37", "38", "39", "40", "41", "42", "Tênis", "Sandália"],
          "Moda íntima e praia": ["P", "M", "G", "Conjunto", "Peça avulsa"]
        }
      },
      eletronicos: {
        label: "Eletrônicos",

        cats: {
          "Celulares": ["64GB", "128GB", "256GB", "Preto", "Azul", "Branco"],
          "Áudio": ["Fone bluetooth", "Caixa de som", "Headset", "Fone com fio"],
          "Acessórios": ["Capinha", "Película", "Carregador turbo", "Cabo USB-C", "Suporte veicular"],
          "Informática": ["Mouse", "Teclado", "Pendrive", "HD externo", "Webcam"]
        }
      }
    };
    const CHANNELS = ["Balcão", "WhatsApp", "Instagram", "Marketplace", "Loja online"];

    function getAccounts() { return storeGet("pv_accounts", []); }
    function saveAccounts(list) { storeSet("pv_accounts", list); }
    function getSession() {
      return storeGet("pv_session", null) || (function(){ try { const v = sessionStorage.getItem("pv_session"); return v ? JSON.parse(v) : null; } catch(e){ return null; } })();
    }
    function setSession(sess, remember) {
      try { sessionStorage.removeItem("pv_session"); } catch (e) {}
      storeSet("pv_session", null);
      localStorage.removeItem("pv_session");
      if (!sess) return;
      if (remember) storeSet("pv_session", sess);
      else { try { sessionStorage.setItem("pv_session", JSON.stringify(sess)); } catch (e) {} }
    }
    function currentAccount() {
      const s = getSession();
      if (!s || !s.uid) return null;
      return getAccounts().find(a => a.id === s.uid) || null;
    }
    function dataKey(uidv) { return "pv_data_" + uidv; }
    function getData(uidv) { return storeGet(dataKey(uidv), { products: [], sales: [] }); }
    function saveData(uidv, data) { storeSet(dataKey(uidv), data); }

    function playSaleSound() {
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        const ctx = playSaleSound._ctx || (playSaleSound._ctx = new Ctx());
        if (ctx.state === "suspended") ctx.resume();
        const t0 = ctx.currentTime;
        const beep = (freq, start, dur, type, gain) => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = type || "triangle"; o.frequency.value = freq;
          g.gain.setValueAtTime(0.0001, t0 + start);
          g.gain.exponentialRampToValueAtTime(gain || 0.22, t0 + start + 0.015);
          g.gain.exponentialRampToValueAtTime(0.0001, t0 + start + dur);
          o.connect(g); g.connect(ctx.destination);
          o.start(t0 + start); o.stop(t0 + start + dur + 0.05);
        };
        /* caixa registradora: sino agudo + "cha-ching" em duas notas */
        beep(1568, 0, 0.16, "square", 0.10);
        beep(2093, 0.07, 0.22, "square", 0.10);
        beep(1319, 0.16, 0.30, "triangle", 0.20);
        beep(1760, 0.24, 0.42, "triangle", 0.20);
      } catch (e) {}
    }

          '<div class="field"><label for="regSenha">Senha</label><div class="input-shell"><span class="icon">' + lockSVG + '</span>' +
          '<input id="regSenha" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password"/>' +
          '<button type="button" class="eye-btn" id="eyeBtn" aria-label="Mostrar ou ocultar senha">' + eyeSVG(false) + '</button></div></div>' +
          '<div class="field"><label for="regNicho">Nicho do seu negócio</label><div class="input-shell">' +
          '<select id="regNicho">' + Object.keys(NICHES).map(k => '<option value="' + k + '">' + esc(NICHES[k].label) + '</option>').join("") + '</select></div></div>' +
          '<div class="field"><label>Logo da empresa <span style="color:var(--muted-2);font-weight:500">(opcional)</span></label>' +
          '<label class="logo-upload"><img id="logoPreview" alt=""/><input id="regLogo" type="file" accept="image/*"/><span id="logoLabel">Toque para enviar a logo</span></label></div>' +
          '<button class="btn btn-primary btn-big" id="registerBtn">Criar conta grátis</button>';
        alt = '<p class="auth-alt">Já tem uma conta? <a href="#" id="goLogin">Entrar</a></p>';
      } else {
        head = '<h1>Recuperar senha</h1><p class="sub">Informe o e-mail da sua conta e defina uma nova senha</p>';
        body =
          '<div class="field"><label for="recEmail">E-mail da conta</label><div class="input-shell"><span class="icon">' + mailSVG + '</span>' +
          '<input id="recEmail" type="email" placeholder="seu@email.com" autocomplete="email"/></div></div>' +
          '<div class="field"><label for="recSenha">Nova senha</label><div class="input-shell"><span class="icon">' + lockSVG + '</span>' +
          '<input id="recSenha" type="password" placeholder="Mínimo de 6 caracteres" autocomplete="new-password"/>' +
          '<button type="button" class="eye-btn" id="eyeBtn" aria-label="Mostrar ou ocultar senha">' + eyeSVG(false) + '</button></div></div>' +
          '<button class="btn btn-primary btn-big" id="recoverBtn">Redefinir senha</button>';
        alt = '<p class="auth-alt">Lembrou a senha? <a href="#" id="goLogin">Voltar para entrar</a></p>';
      }

      app.innerHTML =
      '<div class="auth-shell">' +
        '<a class="auth-brand" href="#/"><span class="mark">' + penguinSVG(38) + '</span><span class="word">Pingou<em style="font-style:normal;color:var(--violet-3)">Venda</em></span></a>' +
        '<div class="auth-card">' + head +
          '<div class="form-error" id="authError"></div>' +
          '<div class="form-ok" id="authOk"></div>' +
          body + alt +
          '<a class="auth-home" href="#/">Conhecer o Pingou Venda →</a>' +
        '</div>' +
      '</div>';
      window.scrollTo(0, 0);
      bindAuth(isLogin, isReg, isRec);
    }

    function authError(msg) {
      const e = $("#authError"), ok = $("#authOk");
      if (ok) ok.classList.remove("show");
      e.textContent = msg; e.classList.add("show");
    }
    function authOkMsg(msg) {
      const e = $("#authError"), ok = $("#authOk");
      if (e) e.classList.remove("show");
      ok.textContent = msg; ok.classList.add("show");
    }

    function bindAuth(isLogin, isReg, isRec) {
      const eye = $("#eyeBtn");
      if (eye) {
        eye.addEventListener("click", () => {
          const input = eye.parentElement.querySelector("input");
          const showing = input.type === "text";
          input.type = showing ? "password" : "text";
          eye.innerHTML = eyeSVG(!showing);
        });
      }
      const goReg = $("#goRegister"), goLog = $("#goLogin");
      if (goReg) goReg.addEventListener("click", (ev) => { ev.preventDefault(); authMode = "cadastro"; drawAuth(); });
      if (goLog) goLog.addEventListener("click", (ev) => { ev.preventDefault(); authMode = "login"; drawAuth(); });

      if (isLogin) {
        const rem = $("#rememberToggle");
        rem.addEventListener("click", () => rem.classList.toggle("on"));
        $("#forgotBtn").addEventListener("click", () => { authMode = "recuperar"; drawAuth(); });
        const doLogin = () => {
          const email = $("#authEmail").value.trim().toLowerCase();
          const senha = $("#authSenha").value;
          if (!email || !senha) return authError("Preencha o e-mail e a senha para entrar.");
          const acc = getAccounts().find(a => a.email === email);
          if (!acc) return authError("Conta não encontrada. Confira o e-mail ou cadastre-se.");
          if (acc.senha !== senha) return authError("Senha incorreta. Tente de novo ou toque em “Esqueceu sua senha?”");
          setSession({ uid: acc.id }, rem.classList.contains("on"));
          toast("Bem-vindo de volta, " + acc.empresa + "!");
          location.hash = "#/painel";
        };
        $("#loginBtn").addEventListener("click", doLogin);
        $("#authSenha").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
        $("#authEmail").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
      }

      if (isReg) {
        const logoInput = $("#regLogo");
        logoInput.addEventListener("change", () => {
          const f = logoInput.files && logoInput.files[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = () => {
            pendingLogo = String(reader.result || "");
            const img = $("#logoPreview");
            img.src = pendingLogo; img.style.display = "block";
            $("#logoLabel").textContent = f.name;
          };
          reader.readAsDataURL(f);
        });
        $("#registerBtn").addEventListener("click", () => {
          const empresa = $("#regEmpresa").value.trim();
          const email = $("#regEmail").value.trim().toLowerCase();
          const senha = $("#regSenha").value;
          const nicho = $("#regNicho").value;
          if (!empresa) return authError("Informe o nome da sua empresa.");
          if (!email || email.indexOf("@") < 1) return authError("Informe um e-mail válido.");
          if (!senha || senha.length < 6) return authError("A senha precisa de pelo menos 6 caracteres.");
          const accounts = getAccounts();
          if (accounts.some(a => a.email === email)) return authError("Já existe uma conta com esse e-mail. Toque em Entrar.");
          const acc = {
            id: uid(), empresa, email, senha, nicho,
            logo: pendingLogo || "",
            createdAt: Date.now(),
            trialEnds: Date.now() + 7 * 24 * 60 * 60 * 1000
          };
          accounts.push(acc);
          saveAccounts(accounts);
          saveData(acc.id, { products: [], sales: [] });
          setSession({ uid: acc.id }, true);
          toast("Conta criada! Bem-vindo ao Pingou Venda 🎉");
          location.hash = "#/painel";
        });
      }

      if (isRec) {
        $("#recoverBtn").addEventListener("click", () => {
          const email = $("#recEmail").value.trim().toLowerCase();
          const senha = $("#recSenha").value;
          const accounts = getAccounts();
          const idx = accounts.findIndex(a => a.email === email);
          if (idx < 0) return authError("Não há conta com esse e-mail neste aparelho.");
          if (!senha || senha.length < 6) return authError("A nova senha precisa de pelo menos 6 caracteres.");
          accounts[idx].senha = senha;
          saveAccounts(accounts);
          authMode = "login";
          drawAuth();
          authOkMsg("Senha redefinida! Entre com a nova senha.");
        });
      }
    }
    </script>

    <script>
    "use strict";
    /* ================= SHELL DAS ÁREAS LOGADAS ================= */
    function appHead(acc, active) {
      const nicheLabel = (NICHES[acc.nicho] || {}).label || "";
      const logo = acc.logo
        ? '<img src="' + acc.logo + '" alt="Logo de ' + esc(acc.empresa) + '"/>'
        : '<span class="mark" style="width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#2a0a57,#170433);border:1px solid var(--line)">' + penguinMini() + '</span>';
      const dias = Math.max(0, Math.ceil((acc.trialEnds - Date.now()) / 86400000));
      return '<header class="app-head"><div class="wrap"><div class="inner">' +
        brandHTML() +
        '<div class="biz">' + logo + '<div><div class="biz-name">' + esc(acc.empresa) + '</div><div class="biz-niche">' + esc(nicheLabel) + '</div></div></div>' +
        (dias > 0 ? '<span class="trial-pill">Teste grátis: ' + dias + ' dia' + (dias === 1 ? "" : "s") + '</span>' : '') +
        '<nav class="main-nav">' +
          '<a href="#/painel" class="' + (active === "painel" ? "active" : "") + '">Painel</a>' +
          '<a href="#/vendas" class="' + (active === "vendas" ? "active" : "") + '">Vendas</a>' +
        '</nav>' +
        '<button class="logout-btn" id="logoutBtn">Sair</button>' +
      '</div></div></header>';
    }
    function bindHead() {
      $("#logoutBtn").addEventListener("click", () => {
        setSession(null, false);
        toast("Você saiu da conta. Até logo!");
        location.hash = "#/";
      });
    }

    /* ================= PAINEL (só métricas) ================= */
    let panelPeriod = "30d";
    const PERIODS = { "hoje": 1, "7d": 7, "30d": 30, "tudo": Infinity };

    function renderPanel() {
      const acc = currentAccount();
      if (!acc) { location.hash = "#/auth"; return; }
      const data = getData(acc.id);
      const sales = data.sales, products = data.products;

      const days = PERIODS[panelPeriod];
      const cutoff = days === Infinity ? 0 : Date.now() - days * 24 * 60 * 60 * 1000;
      const inPeriod = sales.filter(s => s.ts >= cutoff);

      const faturamento = inPeriod.reduce((a, s) => a + s.total, 0);
      const lucro = inPeriod.reduce((a, s) => a + (s.total - (s.custoUnit || 0) * s.qtd), 0);
      const itens = inPeriod.reduce((a, s) => a + s.qtd, 0);
      const margem = faturamento > 0 ? (lucro / faturamento) * 100 : 0;
      const ticket = inPeriod.length > 0 ? faturamento / inPeriod.length : 0;
      const valorEstoque = products.reduce((a, p) => a + p.preco * p.estoque, 0);
      const unidadesEstoque = products.reduce((a, p) => a + p.estoque, 0);

      /* gráfico: vendas por dia */
      const chartDays = days === Infinity ? 30 : Math.min(days === 1 ? 1 : days, 30);
      const buckets = [];
      for (let i = chartDays - 1; i >= 0; i--) {
        const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
        const next = d.getTime() + 24 * 60 * 60 * 1000;
        const total = sales.filter(s => s.ts >= d.getTime() && s.ts < next).reduce((a, s) => a + s.total, 0);
        buckets.push({ label: d.toLocaleDateString("pt-BR", { day: "2-digit", month: "2-digit" }), total });
      }
      const maxBucket = Math.max.apply(null, buckets.map(b => b.total).concat([1]));
      const W = 640, H = 170, bw = W / buckets.length;
      const chartStep = Math.ceil(buckets.length / 8);
      const chartSVG = '<svg viewBox="0 0 ' + W + ' ' + (H + 22) + '" width="100%" role="img" aria-label="Gráfico de vendas por dia">' +
        buckets.map((b, i) => {
          const h = Math.max(b.total > 0 ? 4 : 0, (b.total / maxBucket) * H);
          const showLabel = i % chartStep === 0 || (i === buckets.length - 1 && i % chartStep >= 3);
          return '<rect x="' + (i * bw + bw * 0.18) + '" y="' + (H - h) + '" width="' + (bw * 0.64) + '" height="' + h + '" rx="4" fill="' + (i === buckets.length - 1 ? "#c77dff" : "rgba(157,78,221,.6)") + '"><title>' + b.label + ': ' + BRL(b.total) + '</title></rect>' +
                 (showLabel ? '<text x="' + (i * bw + bw / 2) + '" y="' + (H + 16) + '" fill="#8f7db8" font-size="11" text-anchor="middle">' + b.label + '</text>' : '');
        }).join("") + '</svg>';

      /* vendas por canal */
      const byChannel = CHANNELS.map(ch => {
        const list = inPeriod.filter(s => s.canal === ch);
        return { ch, total: list.reduce((a, s) => a + s.total, 0), n: list.length };
      }).filter(x => x.total > 0).sort((a, b) => b.total - a.total);
      const maxCh = Math.max.apply(null, byChannel.map(x => x.total).concat([1]));

      /* ranking de categorias */
      const catMap = {};
      inPeriod.forEach(s => { catMap[s.categoria] = (catMap[s.categoria] || 0) + s.total; });
      const ranking = Object.keys(catMap).map(c => ({ c, total: catMap[c] })).sort((a, b) => b.total - a.total).slice(0, 5);
      const maxCat = Math.max.apply(null, ranking.map(x => x.total).concat([1]));

      const recent = sales.slice().sort((a, b) => b.ts - a.ts).slice(0, 6);
      const hasSales = sales.length > 0;

      app.innerHTML = appHead(acc, "painel") +
      '<main class="wrap page">' +
        '<div class="page-head"><div><h1>Painel da sua loja</h1><p class="sub">Só números: o desempenho real das suas vendas, sem nada para vender por aqui.</p></div>' +
        '<div class="seg" role="group" aria-label="Período">' +
          [["hoje", "Hoje"], ["7d", "7 dias"], ["30d", "30 dias"], ["tudo", "Tudo"]].map(([k, l]) =>
            '<button data-period="' + k + '" class="' + (panelPeriod === k ? "active" : "") + '">' + l + '</button>').join("") +
        '</div></div>' +

        '<div class="metric-grid">' +
          '<div class="metric"><div class="label">Faturamento</div><div class="value">' + BRL(faturamento) + '</div><div class="hint">' + inPeriod.length + ' venda' + (inPeriod.length === 1 ? "" : "s") + ' no período</div></div>' +
          '<div class="metric"><div class="label">Lucro líquido</div><div class="value">' + BRL(lucro) + '</div><div class="hint">Descontando o custo dos produtos</div></div>' +
          '<div class="metric"><div class="label">Margem</div><div class="value">' + margem.toFixed(1).replace(".", ",") + '%</div><div class="hint">Do faturamento que vira lucro</div></div>' +
          '<div class="metric"><div class="label">Ticket médio</div><div class="value">' + BRL(ticket) + '</div><div class="hint">Valor médio por venda</div></div>' +
          '<div class="metric"><div class="label">Valor em estoque</div><div class="value">' + BRL(valorEstoque) + '</div><div class="hint">' + unidadesEstoque + ' unidades em ' + products.length + ' produto' + (products.length === 1 ? "" : "s") + '</div></div>' +
          '<div class="metric"><div class="label">Itens vendidos</div><div class="value">' + itens + '</div><div class="hint">No período selecionado</div></div>' +
        '</div>' +

        '<div class="panel-grid">' +
          '<section class="panel"><h3>Evolução das vendas <span class="right">por dia</span></h3>' +
            (hasSales ? chartSVG : '<div class="empty"><strong>Nenhuma venda ainda</strong>Quando você registrar a primeira venda, o gráfico aparece aqui.<br/><a class="btn btn-primary btn-sm" href="#/vendas">Ir para Vendas</a></div>') +
          '</section>' +
          '<section class="panel"><h3>Vendas por canal</h3>' +
            (byChannel.length ? byChannel.map((x, i) =>
              '<div class="rank-row"><span class="pos">' + (i + 1) + '</span><div class="rank-wrap"><div style="display:flex;justify-content:space-between;gap:10px"><span class="name">' + esc(x.ch) + '</span><span class="val">' + BRL(x.total) + '</span></div><div class="bar" style="width:' + Math.round(x.total / maxCh * 100) + '%"></div></div></div>'
            ).join("") : '<div class="empty"><strong>Sem vendas no período</strong>Os canais aparecem aqui conforme você vende.</div>') +
          '</section>' +
        '</div>' +

        '<div class="panel-grid">' +
          '<section class="panel"><h3>Ranking de categorias</h3>' +
            (ranking.length ? ranking.map((x, i) =>
              '<div class="rank-row"><span class="pos">' + (i + 1) + '</span><div class="rank-wrap"><div style="display:flex;justify-content:space-between;gap:10px"><span class="name">' + esc(x.c) + '</span><span class="val">' + BRL(x.total) + '</span></div><div class="bar" style="width:' + Math.round(x.total / maxCat * 100) + '%"></div></div></div>'
            ).join("") : '<div class="empty"><strong>Sem categorias vendidas</strong>Monte seu estoque e registre vendas para ver o ranking.</div>') +
          '</section>' +
          '<section class="panel"><h3>Vendas recentes</h3>' +
            (recent.length ? recent.map(s =>
              '<div class="recent-row"><div><div class="who">' + esc(s.nome) + '</div><div class="meta">' + esc(s.canal) + ' · ' + fmtDate(s.ts) + '</div></div><span class="amt">+' + BRL(s.total) + '</span></div>'
            ).join("") : '<div class="empty"><strong>Nada por aqui ainda</strong>Suas vendas mais recentes vão aparecer nesta lista.</div>') +
          '</section>' +
        '</div>' +
      '</main>';
      bindHead();
      $$("[data-period]").forEach(b => b.addEventListener("click", () => { panelPeriod = b.dataset.period; renderPanel(); }));
      window.scrollTo(0, 0);
    }
    </script>

    <script>
    "use strict";
    /* ================= VENDAS ================= */
    let salesState = { search: "", channel: "todos", sort: "recentes", page: 1 };
    const PAGE_SIZE = 8;
    let addState = { cat: null, variacao: null };

    function openModal(html) {
      const veil = $("#modalVeil");
      veil.innerHTML = '<div class="modal" role="dialog" aria-modal="true">' + html + '</div>';
      veil.classList.add("open");
      veil.onclick = (e) => { if (e.target === veil) closeModal(); };
    }
    function closeModal() {
      const veil = $("#modalVeil");
      veil.classList.remove("open");
      veil.innerHTML = "";
    }

    function renderVendas() {
      const acc = currentAccount();
      if (!acc) { location.hash = "#/auth"; return; }
      const data = getData(acc.id);
      const niche = NICHES[acc.nicho] || NICHES.vestuario;
      const catNames = Object.keys(niche.cats);
      if (!addState.cat || catNames.indexOf(addState.cat) < 0) { addState.cat = catNames[0]; addState.variacao = niche.cats[catNames[0]][0]; }
      if (niche.cats[addState.cat].indexOf(addState.variacao) < 0) addState.variacao = niche.cats[addState.cat][0];

      const prodCards = data.products.length ? data.products.map(p => {
        const out = p.estoque <= 0, low = !out && p.estoque <= 3;
        return '<button class="prod" data-sell="' + p.id + '" ' + (out ? "disabled" : "") + '>' +
          '<div class="p-name">' + esc(p.nome) + '</div>' +
          '<div class="p-var">' + esc(p.categoria) + (p.variacao ? " · " + esc(p.variacao) : "") + '</div>' +
          '<div class="p-price">' + BRL(p.preco) + '</div>' +
          '<div class="p-stock ' + (out ? "out" : low ? "low" : "") + '">' + (out ? "Sem estoque" : p.estoque + " em estoque") + '</div>' +
        '</button>';
      }).join("") : '<div class="empty" style="grid-column:1/-1"><strong>Estoque vazio</strong>Monte seu estoque por toque no quadro ao lado e os produtos aparecem aqui para vender.</div>';

      /* lista de vendas filtrada */
      let list = data.sales.slice();
      if (salesState.search) {
        const q = salesState.search.toLowerCase();
        list = list.filter(s => (s.nome + " " + s.categoria + " " + (s.variacao || "")).toLowerCase().indexOf(q) >= 0);
      }
      if (salesState.channel !== "todos") list = list.filter(s => s.canal === salesState.channel);
      if (salesState.sort === "recentes") list.sort((a, b) => b.ts - a.ts);
      if (salesState.sort === "antigas") list.sort((a, b) => a.ts - b.ts);
      if (salesState.sort === "maior") list.sort((a, b) => b.total - a.total);
      if (salesState.sort === "menor") list.sort((a, b) => a.total - b.total);
      const subtotal = list.reduce((a, s) => a + s.total, 0);
      const subItens = list.reduce((a, s) => a + s.qtd, 0);
      const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
      if (salesState.page > pages) salesState.page = pages;
      const pageItems = list.slice((salesState.page - 1) * PAGE_SIZE, salesState.page * PAGE_SIZE);

      app.innerHTML = appHead(acc, "vendas") +
      '<main class="wrap page">' +
        '<div class="page-head"><div><h1>Vender e controlar o estoque</h1><p class="sub">Toque em um produto para vender — o estoque baixa sozinho e o caixa toca a cada venda.</p></div></div>' +

        '<div class="two-col">' +
          '<section class="card"><h3>Toque para vender</h3><p class="sub">Seus produtos em estoque. Toque, ajuste a quantidade e confirme.</p>' +
            '<div class="prod-grid">' + prodCards + '</div>' +
          '</section>' +

          '<section class="card sell-form"><h3>Registrar venda manual</h3><p class="sub">Para vender um item avulso, sem baixar do estoque.</p>' +
            '<div class="field"><label for="manualNome">Produto / descrição</label><input id="manualNome" type="text" placeholder="Ex.: Serviço de entrega"/></div>' +
            '<div class="row2">' +
              '<div class="field"><label for="manualQtd">Quantidade</label><input id="manualQtd" type="number" min="1" value="1"/></div>' +
              '<div class="field"><label for="manualPreco">Valor unitário (R$)</label><input id="manualPreco" type="number" min="0" step="0.01" placeholder="0,00"/></div>' +
            '</div>' +
            '<div class="field"><label for="manualCanal">Canal de venda</label><select id="manualCanal">' + CHANNELS.map(c => '<option>' + c + '</option>').join("") + '</select></div>' +
            '<button class="btn btn-primary" id="manualBtn" style="width:100%">Registrar venda</button>' +
          '</section>' +
        '</div>' +

        '<section class="card" style="margin-top:14px"><h3>Montar estoque por toque</h3>' +
          '<p class="sub">Nicho: <strong style="color:var(--violet-3)">' + esc(niche.label) + '</strong>. Escolha a categoria e a variação tocando — sem digitar listas.</p>' +
          '<div class="picker-label">Categoria</div><div class="chip-row" id="catChips">' +
            catNames.map(c => '<button class="chip" data-cat="' + esc(c) + '" style="cursor:pointer;' + (addState.cat === c ? "background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;border-color:transparent" : "") + '">' + esc(c) + '</button>').join("") +
          '</div>' +
          '<div class="picker-label">Variação</div><div class="chip-row" id="varChips">' +
            niche.cats[addState.cat].map(v => '<button class="chip" data-var="' + esc(v) + '" style="cursor:pointer;' + (addState.variacao === v ? "background:linear-gradient(135deg,var(--violet),var(--violet-2));color:#fff;border-color:transparent" : "") + '">' + esc(v) + '</button>').join("") +
          '</div>' +
          '<div class="sell-form" style="margin-top:16px">' +
            '<div class="field"><label for="addNome">Nome do produto</label><input id="addNome" type="text" placeholder="Ex.: ' + esc(addState.cat) + ' ' + esc(addState.variacao) + '"/></div>' +
            '<div class="row2">' +
              '<div class="field"><label for="addPreco">Preço de venda (R$)</label><input id="addPreco" type="number" min="0" step="0.01" placeholder="0,00"/></div>' +
              '<div class="field"><label for="addCusto">Custo (R$) <span style="color:var(--muted-2);font-weight:500">— p/ o lucro</span></label><input id="addCusto" type="number" min="0" step="0.01" placeholder="0,00"/></div>' +
            '</div>' +
            '<div class="row2">' +
              '<div class="field"><label for="addQtd">Quantidade em estoque</label><input id="addQtd" type="number" min="0" value="10"/></div>' +
              '<div class="field" style="display:flex;align-items:flex-end"><button class="btn btn-primary" id="addBtn" style="width:100%">Adicionar ao estoque</button></div>' +
            '</div>' +
          '</div>' +
          (data.products.length ?
            '<div class="picker-label" style="margin-top:18px">No estoque agora</div>' +
            data.products.map(p =>
              '<div class="sale-row"><div class="s-main"><div class="s-name">' + esc(p.nome) + '</div><div class="s-meta">' + esc(p.categoria) + (p.variacao ? " · " + esc(p.variacao) : "") + ' · ' + p.estoque + ' un. · custo ' + BRL(p.custo || 0) + '</div></div>' +
              '<div class="s-amt"><div class="v">' + BRL(p.preco) + '</div></div>' +
              '<button class="btn btn-danger btn-sm" data-del-prod="' + p.id + '">Excluir</button></div>'
            ).join("") : '') +
        '</section>' +

        '<section class="card" style="margin-top:14px"><h3>Suas vendas</h3><p class="sub">Busque, filtre por canal, ordene e exporte quando precisar.</p>' +
          '<div class="toolbar">' +
            '<input type="search" id="saleSearch" placeholder="Buscar venda, produto, categoria…" value="' + esc(salesState.search) + '"/>' +
            '<select id="saleChannel"><option value="todos">Todos os canais</option>' + CHANNELS.map(c => '<option ' + (salesState.channel === c ? "selected" : "") + '>' + c + '</option>').join("") + '</select>' +
            '<select id="saleSort">' +
              '<option value="recentes" ' + (salesState.sort === "recentes" ? "selected" : "") + '>Mais recentes</option>' +
              '<option value="antigas" ' + (salesState.sort === "antigas" ? "selected" : "") + '>Mais antigas</option>' +
              '<option value="maior" ' + (salesState.sort === "maior" ? "selected" : "") + '>Maior valor</option>' +
              '<option value="menor" ' + (salesState.sort === "menor" ? "selected" : "") + '>Menor valor</option>' +
            '</select>' +
            '<button class="btn btn-ghost btn-sm" id="csvBtn">Exportar CSV</button>' +
          '</div>' +
          '<div class="subtotal-bar"><span>Subtotal do filtro: <strong>' + BRL(subtotal) + '</strong></span><span style="color:var(--muted)">' + list.length + ' venda' + (list.length === 1 ? "" : "s") + ' · ' + subItens + ' itens</span></div>' +
          (pageItems.length ? pageItems.map(s =>
            '<div class="sale-row"><div class="s-main"><div class="s-name">' + esc(s.nome) + '</div><div class="s-meta">' + fmtDate(s.ts) + ' · ' + esc(s.categoria) + (s.variacao ? " · " + esc(s.variacao) : "") + '</div></div>' +
            '<span class="tag">' + esc(s.canal) + '</span>' +
            '<div class="s-amt"><div class="v">' + BRL(s.total) + '</div><div class="u">' + s.qtd + ' × ' + BRL(s.precoUnit) + '</div></div></div>'
          ).join("") : '<div class="empty"><strong>Nenhuma venda encontrada</strong>' + (data.sales.length ? "Ajuste a busca ou o filtro para ver outras vendas." : "Quando você registrar a primeira venda, ela aparece aqui.") + '</div>') +
          (pages > 1 ? '<div class="pager"><button id="pgPrev" ' + (salesState.page <= 1 ? "disabled" : "") + '>← Anterior</button><span>Página ' + salesState.page + ' de ' + pages + '</span><button id="pgNext" ' + (salesState.page >= pages ? "disabled" : "") + '>Próxima →</button></div>' : '') +
        '</section>' +
      '</main>';
      bindHead();
      bindVendas(acc);
      window.scrollTo(0, 0);
    }

    function registerSale(acc, sale) {
      const data = getData(acc.id);
      data.sales.push(sale);
      saveData(acc.id, data);
      playSaleSound();
      toast("Pingou venda! " + BRL(sale.total) + " registrados 🎉");
    }

    function openSellModal(acc, product) {
      let qty = 1;
      openModal(
        '<h3>' + esc(product.nome) + '</h3>' +
        '<p class="sub">' + esc(product.categoria) + (product.variacao ? " · " + esc(product.variacao) : "") + ' — ' + product.estoque + ' em estoque</p>' +
        '<label style="font-weight:600;font-size:14px">Canal de venda</label>' +
        '<select id="sellChannel" style="width:100%;margin-top:7px;background:rgba(199,125,255,.05);border:1px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--text);font-size:15.5px">' +
          CHANNELS.map(c => '<option>' + c + '</option>').join("") + '</select>' +
        '<div class="qty-row"><button class="qty-btn" id="qMinus" aria-label="Diminuir">−</button><span class="qty-num" id="qNum">1</span><button class="qty-btn" id="qPlus" aria-label="Aumentar">+</button></div>' +
        '<div class="total-line"><span>Total da venda</span><strong id="qTotal">' + BRL(product.preco) + '</strong></div>' +
        '<div class="modal-actions"><button class="btn btn-ghost" id="qCancel">Cancelar</button><button class="btn btn-primary" id="qConfirm">Confirmar venda</button></div>'
      );
      const upd = () => {
        $("#qNum").textContent = qty;
        $("#qTotal").textContent = BRL(product.preco * qty);
        $("#qMinus").disabled = qty <= 1;
        $("#qPlus").disabled = qty >= product.estoque;
      };
      upd();
      $("#qMinus").addEventListener("click", () => { if (qty > 1) { qty--; upd(); } });
      $("#qPlus").addEventListener("click", () => { if (qty < product.estoque) { qty++; upd(); } });
      $("#qCancel").addEventListener("click", closeModal);
      $("#qConfirm").addEventListener("click", () => {
        const data = getData(acc.id);
        const p = data.products.find(x => x.id === product.id);
        if (!p || p.estoque < qty) { toast("Estoque insuficiente para essa quantidade."); return; }
        p.estoque -= qty;
        data.sales.push({
          id: uid(), produtoId: p.id, nome: p.nome, categoria: p.categoria, variacao: p.variacao || "",
          qtd: qty, precoUnit: p.preco, custoUnit: p.custo || 0, total: p.preco * qty,
          canal: $("#sellChannel").value, ts: Date.now()
        });
        saveData(acc.id, data);
        closeModal();
        playSaleSound();
        toast("Pingou venda! " + BRL(p.preco * qty) + " — estoque atualizado 🎉");
        renderVendas();
      });
    }

    function bindVendas(acc) {
      $$("[data-sell]").forEach(btn => btn.addEventListener("click", () => {
        const data = getData(acc.id);
        const p = data.products.find(x => x.id === btn.dataset.sell);
        if (p) openSellModal(acc, p);
      }));

      $("#manualBtn").addEventListener("click", () => {
        const nome = $("#manualNome").value.trim();
        const qtd = Math.max(1, parseInt($("#manualQtd").value, 10) || 0);
        const preco = parseFloat($("#manualPreco").value);
        if (!nome) return toast("Dê um nome à venda manual.");
        if (!preco || preco <= 0) return toast("Informe o valor da venda.");
        registerSale(acc, {
          id: uid(), produtoId: null, nome, categoria: "Venda manual", variacao: "",
          qtd, precoUnit: preco, custoUnit: 0, total: preco * qtd,
          canal: $("#manualCanal").value, ts: Date.now()
        });
        renderVendas();
      });

      $$("#catChips [data-cat]").forEach(chip => chip.addEventListener("click", () => {
        addState.cat = chip.dataset.cat;
        addState.variacao = (NICHES[acc.nicho].cats[addState.cat] || [])[0];
        renderVendas();
      }));
      $$("#varChips [data-var]").forEach(chip => chip.addEventListener("click", () => {
        addState.variacao = chip.dataset.var;
        renderVendas();
      }));

      $("#addBtn").addEventListener("click", () => {
        const data = getData(acc.id);
        const nome = $("#addNome").value.trim() || (addState.cat + " " + addState.variacao);
        const preco = parseFloat($("#addPreco").value);
        const custo = parseFloat($("#addCusto").value) || 0;
        const qtd = parseInt($("#addQtd").value, 10);
        if (!preco || preco <= 0) return toast("Informe o preço de venda do produto.");
        if (isNaN(qtd) || qtd < 0) return toast("Informe a quantidade em estoque.");
        data.products.push({ id: uid(), nome, categoria: addState.cat, variacao: addState.variacao, preco, custo, estoque: qtd });
        saveData(acc.id, data);
        toast("Produto adicionado ao estoque ✅");
        renderVendas();
      });

      $$("[data-del-prod]").forEach(btn => btn.addEventListener("click", () => {
        const data = getData(acc.id);
        data.products = data.products.filter(p => p.id !== btn.dataset.delProd);
        saveData(acc.id, data);
        toast("Produto excluído do estoque.");
        renderVendas();
      }));

      let searchTimer = null;
      $("#saleSearch").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          salesState.search = e.target.value; salesState.page = 1; renderVendas();
          const el = $("#saleSearch"); if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
        }, 350);
      });
      $("#saleChannel").addEventListener("change", (e) => { salesState.channel = e.target.value; salesState.page = 1; renderVendas(); });
      $("#saleSort").addEventListener("change", (e) => { salesState.sort = e.target.value; salesState.page = 1; renderVendas(); });
      const prev = $("#pgPrev"), next = $("#pgNext");
      if (prev) prev.addEventListener("click", () => { salesState.page--; renderVendas(); });
      if (next) next.addEventListener("click", () => { salesState.page++; renderVendas(); });

      $("#csvBtn").addEventListener("click", () => {
        const data = getData(acc.id);
        if (!data.sales.length) return toast("Ainda não há vendas para exportar.");
        const rows = [["Data", "Produto", "Categoria", "Variação", "Quantidade", "Preço unitário", "Total", "Canal"]];
        data.sales.slice().sort((a, b) => a.ts - b.ts).forEach(s => rows.push([
          new Date(s.ts).toLocaleString("pt-BR"), s.nome, s.categoria, s.variacao || "",
          s.qtd, String(s.precoUnit).replace(".", ","), String(s.total).replace(".", ","), s.canal
        ]));
        const csv = "﻿" + rows.map(r => r.map(c => '"' + String(c).replace(/"/g, '""') + '"').join(";")).join("\r\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "vendas-pingou-venda.csv";
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(a.href), 2000);
        toast("CSV exportado com " + data.sales.length + " vendas 📄");
      });
    }

    /* ================= ROTEADOR ================= */
    function route() {
      const hash = location.hash || "#/";
      const [path, query] = hash.slice(1).split("?");
      const params = new URLSearchParams(query || "");
      if (path === "/" || path === "") return renderLanding();
      if (path === "/auth") {
        if (currentAccount()) { location.hash = "#/painel"; return; }
        return renderAuth(params);
      }
      if (path === "/painel") return renderPanel();
      if (path === "/vendas") return renderVendas();
      renderLanding();
    }
    window.addEventListener("hashchange", route);
    route();
    </script>
  </body>
</html>
